name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The uploaded project doesn't include the gradlew wrapper binaries
      # (gradlew, gradlew.bat, gradle-wrapper.jar), so we install the exact
      # Gradle version declared in gradle/wrapper/gradle-wrapper.properties
      # and call it directly instead of ./gradlew.
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vectorforge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
